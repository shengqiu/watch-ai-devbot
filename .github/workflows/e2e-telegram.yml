name: E2E Telegram Boot Test

on:
  workflow_dispatch:
    inputs:
      command:
        description: "要测试的指令文本"
        required: false
        default: "开始开发"

jobs:
  e2e:
    name: Send fake Telegram webhook
    runs-on: ubuntu-latest
    steps:
      - name: Send webhook and report
        env:
          WORKER_URL: ${{ vars.WORKER_BASE_URL }}
          CMD: ${{ inputs.command }}
          GH_TOKEN: ${{ secrets.GH_CODESPACE_E2E_TOKEN }}
          WEBHOOK_SECRET: ${{ secrets.E2E_WEBHOOK_SECRET }}
          E2E_ANSWER: ${{ secrets.E2E_VERIFY_ANSWER }}
          TEST_USER_ID: ${{ vars.E2E_TEST_USER_ID }}
        run: |
          set -e
          echo "目标: $WORKER_URL  指令: $CMD  测试用户: $TEST_USER_ID"

          send() { # send <text> <update_id>
            local body
            body=$(jq -n --arg text "$1" --argjson uid "$2" --argjson now "$(date +%s)" --argjson uid2 "$TEST_USER_ID" \
              '{update_id: $uid, message: {message_id: 1, chat: {id: $uid2, type: "private"}, from: {id: $uid2}, date: $now, text: $text}}')
            curl -s -w "\nHTTP=%{http_code}" -X POST "$WORKER_URL/webhook" \
              -H "Content-Type: application/json" -H "X-Telegram-Bot-Api-Secret-Token: $WEBHOOK_SECRET" \
              -d "$body" --max-time 120 | tail -1
          }

          echo "--- 0) 防伪验证：不带密钥头的请求应被 403 拒绝 ---"
          NOAUTH_BODY=$(jq -n --argjson now "$(date +%s)" --argjson uid2 "$TEST_USER_ID" \
            '{update_id: 888888001, message: {message_id: 1, chat: {id: $uid2, type: "private"}, from: {id: $uid2}, date: $now, text: "hi"}}')
          NOAUTH=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$WORKER_URL/webhook" \
            -H "Content-Type: application/json" -d "$NOAUTH_BODY" --max-time 30)
          echo "无密钥头 HTTP 状态: $NOAUTH (预期 403)"
          [ "$NOAUTH" = "403" ] || { echo "::error::防伪校验未生效"; exit 1; }

          echo "--- 1) 发送指令（未验证状态 → 应被验证拦截，不触发 codespace 动作）---"
          R1=$(send "$CMD" 888888101)
          echo "HTTP $R1（bot 应回验证问题给测试用户）"

          echo "--- 2) 发送验证答案「爸爸」---"
          R2=$(send "$E2E_ANSWER" 888888102)
          echo "HTTP $R2"

          echo "--- 3) 再发指令（已验证 → 正常执行）---"
          R3=$(send "$CMD" 888888103)
          echo "HTTP $R3"

          echo "--- 4) 70 秒后查 codespace 状态（覆盖 alarm 30s + start 完成时间）---"
          sleep 70
          gh api /user/codespaces/${{ vars.CODESPACE_NAME }} --jq '"codespace state: " + .state' || echo "查询失败"

          echo "=== E2E 完成：防伪 403 ✓ / 验证流程走通 ✓ ==="
