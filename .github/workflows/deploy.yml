name: Test → Promote → Deploy

# 两分支模型（个人项目，刻意保持极简）：
#   dev  = 开发分支。push 到这里只跑测试，不上线。
#   main = 部署分支。只有测试通过后由 CI 自动晋升（dev → main），然后在 main 上部署。
#
# 「AI 负责测试，通过后有权限上线」的落地方式：
#   测试就是 workers-impl 里那 447 条断言（AI 写的），CI 是执行器；
#   绿了 -> promote job 自动把 dev 快进到 main -> deploy job 上线。
#   失败 -> 卡在 dev，绝不会碰 main。
#   不给任何 agent 额外的 main 推送凭据，晋升权限只存在于这份 workflow 里。
#
# 注意：promote 用内置 GITHUB_TOKEN 推 main，GitHub 不会再触发一次 push 事件
#（防止递归），所以部署必须在同一个 workflow 内接在 promote 后面，不能指望 main 的 push 事件。

on:
  push:
    branches: [dev, main]
    paths:
      - "workers-impl/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (skip real deploy)"
        required: false
        default: "false"

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers-impl
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: workers-impl/package-lock.json

      - name: Install dependencies (retry for esbuild ETXTBSY flake)
        run: |
          for i in 1 2 3; do
            npm ci && break
            echo "npm ci attempt $i failed, retrying in 10s..."
            sleep 10
            [ "$i" = "3" ] && exit 1
          done

      - name: Typecheck
        run: npm run typecheck

      - name: Logic tests
        run: npm test

      # ---- 接线护栏（独立于 src/test 文件，防「陈旧工作副本覆盖」）----
      # 2026-10-29 发生过两次：另一个会话把 bot-do.ts / index.ts 等整体提交成旧版本，
      # 一次性抹掉 412 行 Slack 集成并一路绿灯部署上线。test/logic.test.mjs 里的
      # 断言也跟着被覆盖，于是「集成还在不在」没人把关。
      # 这道检查只读源码文本，放在 workflow 里（对方不会碰这个文件），
      # 任何人把 Slack 接线删掉都会在这里卡红，阻止上线。
      - name: Wiring guard（Slack 接线必须存在）
        run: |
          fail=0
          check_present() {
            if grep -q -- "$2" "$1"; then
              echo "  ✅ $1"
            else
              echo "  ❌ $1 缺少：$2"
              fail=1
            fi
          }
          echo "检查 Slack 通道接线："
          check_present workers-impl/src/bot-do.ts "handleSlackEvents"
          check_present workers-impl/src/bot-do.ts "handleSlackCommand"
          check_present workers-impl/src/bot-do.ts 'channelOf(chatId) === "slack"'
          check_present workers-impl/src/index.ts "/slack/events"
          check_present workers-impl/src/index.ts "/slack/commands"
          check_present workers-impl/src/index.ts "verifySlackRequest"
          check_present workers-impl/src/bot-do.ts "new ShellHub((chatId, text, opts)"
          echo "检查 Slack 通道配置文件："
          check_present workers-impl/src/slack/update.ts "extractSlackEvent"
          check_present workers-impl/src/slack/verify.ts "verifySlackRequest"
          if [ "$fail" != "0" ]; then
            echo "::error::Slack 通道接线缺失 —— 拒绝上线（若这是有意删除，请同时删除 test/slack.test.mjs 与本步骤）"
            exit 1
          fi
          echo "Slack 接线完整 ✅"

  # ---- dev 上的提交：测试通过后自动晋升到 main ----
  promote:
    name: dev → main
    needs: test
    if: github.ref_name == 'dev' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge dev into main
        run: |
          git config user.name "watch-ai-bot"
          git config user.email "watch-ai-bot@users.noreply.github.com"
          git fetch origin main dev
          git checkout -B main origin/main
          # 普通 merge 而非 --ff-only：main 上偶发的紧急修补也能被吸收
          git merge --no-edit origin/dev
          git push origin main
          echo "已晋升：$(git rev-parse --short HEAD)"

  # ---- 部署：main 被推，或 dev 刚晋升成功 ----
  deploy:
    name: Deploy to Cloudflare Workers
    needs: [test, promote]
    if: |
      !cancelled() && needs.test.result == 'success' &&
      (github.ref_name == 'main' || needs.promote.result == 'success')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers-impl
    steps:
      # 部署必须取 main 的内容：dev 晋升路径下两者相同，直接推 main 时也对
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: workers-impl/package-lock.json

      - name: Install dependencies (retry for esbuild ETXTBSY flake)
        run: |
          for i in 1 2 3; do
            npm ci && break
            echo "npm ci attempt $i failed, retrying in 10s..."
            sleep 10
            [ "$i" = "3" ] && exit 1
          done

      - name: Dry-run check (pre-flight)
        run: npx wrangler deploy --dry-run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run != 'true'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      # 关键是这一步：wrangler deploy 只是上传新版本，被 SSE 长连接钉住的 DO 实例
      # 仍在跑旧代码（部署「成功」但线上版本号不变）。调 /admin/reload 让它 abort 自己，
      # 下次请求就用新代码创建实例。
      - name: Reload Durable Object（让新代码立即生效）
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run != 'true'
        continue-on-error: true
        run: |
          echo "POST ${{ vars.WORKER_BASE_URL }}/admin/reload (DEPLOY_KEY 走 Authorization 头，不进 URL)"
          curl -sS --max-time 20 -X POST \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_KEY }}" \
            "${{ vars.WORKER_BASE_URL }}/admin/reload" || true
          echo
          echo "（401 = DEPLOY_KEY 未配置；这步失败不影响部署本身）"

      # 光有 reload 不够：它带 continue-on-error，401 会被吞掉。
      # 踩过的坑（v4.10）：reload 一直 401，CI 全绿，但线上其实还停在旧版本好几个小时。
      # 所以用 reload 响应里自带的 build 字段做闭环校验 —— 拿不到就降级成 warning
      # （DEPLOY_KEY 没配时别把 CI 卡红），拿到了就必须和源码里的 BUILD 对得上。
      - name: Verify 线上确实是新版本（防止部署静默失效）
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run != 'true'
        run: |
          EXPECTED=$(sed -n 's/^const BUILD = "\(.*\)";.*/\1/p' src/bot-do.ts | head -1)
          echo "期望 BUILD: $EXPECTED"
          # reload 的响应带的是「处理该请求的那个实例」的 BUILD。实例自毁后
          # 下一次请求才建新实例，所以先 reload 触发换版，等一下再取一次，
          # 第二次拿到的才是新实例的版本号。
          curl -sS --max-time 20 -X POST \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_KEY }}" \
            "${{ vars.WORKER_BASE_URL }}/admin/reload" >/dev/null 2>&1 || true
          sleep 5
          ACTUAL=$(curl -sS --max-time 20 -X POST \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_KEY }}" \
            "${{ vars.WORKER_BASE_URL }}/admin/reload" 2>/dev/null | jq -r '.build // empty')
          if [ -z "$ACTUAL" ]; then
            echo "::warning::拿不到线上 BUILD（DEPLOY_KEY 未配置或鉴权失败），跳过校验"
            exit 0
          fi
          echo "线上 BUILD: $ACTUAL"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::部署未生效：线上跑的是 $ACTUAL，期望 $EXPECTED"
            echo "::error::常见原因：DO 被 SSE 长连接钉住且 reload 没生效 —— 考虑 bump wrangler.toml 的 DO_KEY 强制换版"
            exit 1
          fi
          echo "OK 线上已是 $ACTUAL"
